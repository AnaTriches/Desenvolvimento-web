<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-do List</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>To-do List</h1>
    <section id="formulario">
        <form onsubmit="adicionar(event)">
            <label for="atividades">Adicione uma atividade na To-do List</label>
            <input type="text" name="atividades">
            <button>Adicionar</button>
        </form>

        <h2>Lista das Atividades</h2>
        <ul class="lista"></ul>

    </section>

</body>
<script src="script.js"></script>
</html>
