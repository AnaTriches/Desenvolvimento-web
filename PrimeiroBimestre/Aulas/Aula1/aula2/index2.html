<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    <fieldset>
        <legend>Registre-se</legend>
        <h1>Faça seu registro para utilizar nossos serviços</h1>
        <form action="/url-api-back-end" method="post">
            <label for="nome">Informe seu nome</label>
            <input type="text" id="nome" name="nome"
                title="informe seu nome completo"
                pattern="/^[A-Za-z\s]+$/"
                placeholder="Nome" required maxlength="10">
            <br>

            <label for="email">Informe seu email</label>
            <input type="email" id="email" name="email"
                title="informe seu email"
                placeholder="email">
            <br>

            <label for="senha">Digite sua senha</label>
            <input type="password" id="senha" name="senha"
                title="digite sua senha "
                pattern="/^[A-Za-z\s]+$/"
                placeholder="senha" required maxlength="10">
            <br>

            <label for="bio">Insira sua biografia</label>
            <br>
            <textarea name="bio" id="bio" 
                placeholder="escreva..."
                style="resize: none;"
                rows="6" cols="20">
            </textarea>
            <br>
            <br>

            <select name="melhor-time" id="time">
                <optgroup label="Time serie A">
                    <option value="selecione" disabled selected>Selecione</option>
                    <option value="Flamengo">Flamengo</option>
                    <option value="Flamengo">Corinthians</option>
                    <option value="Flamengo">Grêmio</option>
                    <option value="Flamengo">Botafogo</option>
                    <option value="Flamengo">Palmeiras</option>
                </optgroup>
                <optgroup label="Time serie B">
                    <option value="Cascavel">Cascavel</option>
                </optgroup>
            </select>
            <br>
            <br>

            <input type="submit" value="Enviar">
        </form>
    </fieldset>
</body>
</html>
